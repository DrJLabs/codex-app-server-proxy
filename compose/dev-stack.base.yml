services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-app-server-proxy:dev
    environment:
      - PORT=${DEV_PORT:-18010}
      - PROXY_ENV=dev
      # Enable origin-level CORS while Cloudflare dev rule is disabled
      - PROXY_ENABLE_CORS=true
      - PROXY_CORS_ALLOWED_ORIGINS=${PROXY_CORS_ALLOWED_ORIGINS?set PROXY_CORS_ALLOWED_ORIGINS}
      - PROXY_ENABLE_METRICS=${PROXY_ENABLE_METRICS:-}
      - PROXY_METRICS_ALLOW_UNAUTH=${PROXY_METRICS_ALLOW_UNAUTH:-}
      - PROXY_METRICS_ALLOW_LOOPBACK=${PROXY_METRICS_ALLOW_LOOPBACK:-}
      - PROXY_METRICS_TOKEN=${PROXY_METRICS_TOKEN:-}
      - PROXY_API_KEY=${PROXY_API_KEY?set-in-.env.dev}
      - PROXY_HOST=${PROXY_HOST:-0.0.0.0}
      - PROXY_ENV=dev
      - CODEX_HOME=/home/node/.codex
      # Early finalize non-stream responses in DEV if backend is slow, to avoid edge 524
      - PROXY_NONSTREAM_TRUNCATE_AFTER_MS=${PROXY_NONSTREAM_TRUNCATE_AFTER_MS:-0}
      - WORKER_STARTUP_TIMEOUT_MS=60000
      - PROXY_LOG_PROTO=${PROXY_LOG_PROTO:-true}
      - PROTO_LOG_PATH=/home/node/.codex/proto-events.ndjson
      - CODEX_MODEL=${CODEX_MODEL:-gpt-5.2}
      - PROXY_TITLE_GEN_INTERCEPT=${PROXY_TITLE_GEN_INTERCEPT:-true}
      - PROXY_TITLE_SUMMARY_EXEC_MODEL=${PROXY_TITLE_SUMMARY_EXEC_MODEL:-gpt-5.2}
      - PROXY_TITLE_SUMMARY_EXEC_REASONING_EFFORT=${PROXY_TITLE_SUMMARY_EXEC_REASONING_EFFORT:-low}
      - CODEX_FORCE_PROVIDER=
      # In dev, prefer streaming by default unless the client explicitly sets stream:false.
      - PROXY_DEFAULT_STREAM=${PROXY_DEFAULT_STREAM:-true}
      - PROXY_RESPONSES_OUTPUT_MODE=${PROXY_RESPONSES_OUTPUT_MODE:-}
      - PROXY_COPILOT_AUTO_DETECT=${PROXY_COPILOT_AUTO_DETECT:-}
      - PROXY_SANDBOX_MODE=${PROXY_SANDBOX_MODE:-read-only}
      - PROXY_AUTH_LOGIN_URL=${PROXY_AUTH_LOGIN_URL:-}
      - PROXY_AUTH_LOGIN_URL_MODE=${PROXY_AUTH_LOGIN_URL_MODE:-}
      - PROXY_USE_APP_SERVER=${PROXY_USE_APP_SERVER:-true}
      - PROXY_TIMEOUT_MS=${PROXY_TIMEOUT_MS:-300000}
      - PROXY_IDLE_TIMEOUT_MS=${PROXY_IDLE_TIMEOUT_MS:-15000}
      - PROXY_STREAM_IDLE_TIMEOUT_MS=${PROXY_STREAM_IDLE_TIMEOUT_MS:-300000}
      - PROXY_SSE_KEEPALIVE_MS=${PROXY_SSE_KEEPALIVE_MS:-15000}
      - PROXY_SSE_MAX_CONCURRENCY=${PROXY_SSE_MAX_CONCURRENCY:-20}
      - WORKER_MAX_CONCURRENCY=${WORKER_MAX_CONCURRENCY:-4}
      - PROXY_MAX_CHAT_CHOICES=${PROXY_MAX_CHAT_CHOICES:-20}
      # Streaming guards for tool-heavy clients (optional; disabled unless set in .env.dev)
      - PROXY_STOP_AFTER_TOOLS=${PROXY_STOP_AFTER_TOOLS:-}
      - PROXY_STOP_AFTER_TOOLS_MODE=${PROXY_STOP_AFTER_TOOLS_MODE:-burst}
      - PROXY_STOP_AFTER_TOOLS_GRACE_MS=${PROXY_STOP_AFTER_TOOLS_GRACE_MS:-300}
      - PROXY_TOOL_BLOCK_MAX=${PROXY_TOOL_BLOCK_MAX:-0}
      - PROXY_SUPPRESS_TAIL_AFTER_TOOLS=${PROXY_SUPPRESS_TAIL_AFTER_TOOLS:-}
      - PROXY_ENABLE_PARALLEL_TOOL_CALLS=${PROXY_ENABLE_PARALLEL_TOOL_CALLS:-}
      - PROXY_LOG_CORS_ORIGIN=${PROXY_LOG_CORS_ORIGIN:-true}
      - PROXY_TRACE_REDACT=${PROXY_TRACE_REDACT:-}
      # Default to real Codex CLI; override with CODEX_BIN=/app/scripts/fake-codex-jsonrpc.js for the shim
      - CODEX_BIN=${CODEX_BIN:-/usr/local/lib/codex-cli/bin/codex.js}
      # Copilot capture (sanitized transcripts)
      - PROXY_CAPTURE_CHAT_TRANSCRIPTS=${PROXY_CAPTURE_CHAT_TRANSCRIPTS:-}
      - PROXY_CAPTURE_CHAT_DIR=${PROXY_CAPTURE_CHAT_DIR:-/app/test-results/chat-copilot/raw}
      - PROXY_CAPTURE_CHAT_RAW_TRANSCRIPTS=${PROXY_CAPTURE_CHAT_RAW_TRANSCRIPTS:-}
      - PROXY_CAPTURE_CHAT_RAW_DIR=${PROXY_CAPTURE_CHAT_RAW_DIR:-/app/test-results/chat-copilot/raw-unredacted}
      - PROXY_CAPTURE_RESPONSES_TRANSCRIPTS=${PROXY_CAPTURE_RESPONSES_TRANSCRIPTS:-}
      - PROXY_CAPTURE_RESPONSES_DIR=${PROXY_CAPTURE_RESPONSES_DIR:-/app/test-results/responses-copilot/raw}
      - PROXY_CAPTURE_RESPONSES_RAW_TRANSCRIPTS=${PROXY_CAPTURE_RESPONSES_RAW_TRANSCRIPTS:-}
      - PROXY_CAPTURE_RESPONSES_RAW_DIR=${PROXY_CAPTURE_RESPONSES_RAW_DIR:-/app/test-results/responses-copilot/raw-unredacted}
      - PROXY_CAPTURE_APP_SERVER_RAW=${PROXY_CAPTURE_APP_SERVER_RAW:-}
      - PROXY_CAPTURE_APP_SERVER_RAW_DIR=${PROXY_CAPTURE_APP_SERVER_RAW_DIR:-/app/test-results/app-server/raw}
      - PROXY_CAPTURE_APP_SERVER_RAW_MAX_BYTES=${PROXY_CAPTURE_APP_SERVER_RAW_MAX_BYTES:-}
      - PROXY_CAPTURE_THINKING_RAW=${PROXY_CAPTURE_THINKING_RAW:-}
      - PROXY_CAPTURE_THINKING_RAW_DIR=${PROXY_CAPTURE_THINKING_RAW_DIR:-/app/test-results/responses-copilot/raw-thinking}
      - PROXY_CAPTURE_THINKING_RAW_MAX_BYTES=${PROXY_CAPTURE_THINKING_RAW_MAX_BYTES:-}
    volumes:
      # Project-local Codex config; writable for rollouts/sessions
      - ./.codev:/home/node/.codex
      # Mount scripts so the JSON-RPC shim is available as /app/scripts/fake-codex-jsonrpc.js
      - ./scripts:/app/scripts:ro
      # Persist Copilot capture artifacts
      - ./test-results:/app/test-results
    networks:
      - traefik
    restart: unless-stopped

  auth-dev:
    image: node:22-alpine
    working_dir: /app
    command: node server.mjs
    environment:
      - PORT=8080
      - PROXY_API_KEY=${PROXY_API_KEY?set-in-.env.dev}
      - AUTH_REALM=api-dev
    volumes:
      - ./auth:/app:ro
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
